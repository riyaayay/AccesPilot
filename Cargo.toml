[workspace]
resolver = "2"
members = [
    "crates/ap-core",
    "crates/ap-store",
    "crates/ap-psp",
    "crates/ap-agent",
    "crates/ap-gateway",
    "crates/ap-harness",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Riya Rathod"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "uuid", "chrono", "json"] }
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
proptest = "1.4"
wiremock = "0.6"
async-stream = "0.3"
futures-util = "0.3"

